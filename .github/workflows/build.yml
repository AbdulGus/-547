name: Build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: library-jar
          path: target/library-1.0.0.jar
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Dtest=ApiIntegrationTest,QueryCountTest -Dspring.datasource.url=jdbc:postgresql://localhost:5432/library -Dspring.datasource.username=library -Dspring.datasource.password=test-password
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Check app
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/swagger-ui/index.html > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/books)" = "401"
          TOKEN=$(curl -fsS http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@library.local","password":"LibraryAdmin123!"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS http://localhost:8080/api/books -H "Authorization: Bearer $TOKEN" | python3 -c 'import json,sys; assert json.load(sys.stdin)["totalElements"] == 3'
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
